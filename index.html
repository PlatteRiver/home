          "description": "Esri Business Partner providing GIS consulting, location intelligence, ArcGIS Online and Enterprise implementation, GIS Kickstart, ArcGIS training, and AcreVision buildable-acreage analysis for energy, broadband, and real estate.",

          "knowsAbout": [
            "GIS consulting",

            "ArcGIS Pro",
            "ArcGIS Enterprise",

            "site selection",

            "AcreVision"
          ],
          "sameAs": [
            "https://www.linkedin.com/company/platte-river-analytics/",

          ],
          "hasOfferCatalog": {
            "@type": "OfferCatalog",
            "name": "GIS services and products",
            "itemListElement": [
              {
                "@type": "Offer",
                "itemOffered": {
                  "@type": "Service",
                  "name": "GIS Kickstart",
                  "url": "https://www.platte-river.com/gis-kickstart",
                  "description": "3-day virtual or on-site ArcGIS Online setup: data publishing, users and groups, web maps, apps, dashboards, and training."
                }
              },
              {
                "@type": "Offer",
                "itemOffered": {
                  "@type": "Service",
                  "name": "ArcGIS and GIS Training",
                  "url": "https://www.platte-river.com/training",

              },
              {
                "@type": "Offer",

                  "@type": "SoftwareApplication",

              {
                "@type": "Offer",

                  "@type": "Service",

          }
        },
        {
          "@type": "WebSite",
          "@id": "https://www.platte-river.com/#website",
          "url": "https://www.platte-river.com",
          "name": "Platte River Analytics",
          "publisher": { "@id": "https://www.platte-river.com/#organization" },
          "inLanguage": "en-US"
        },
        {
          "@type": "FAQPage",
          "@id": "https://www.platte-river.com/#faq",
          "mainEntity": [
            {
              "@type": "Question",
              "name": "Who is Platte River Analytics?",
              "acceptedAnswer": {
                "@type": "Answer",
                "text": "Platte River Analytics is an Esri Business Partner in Monticello, Illinois that provides GIS consulting, location intelligence, ArcGIS implementation, and training for energy, broadband, real estate, and government organizations. Website: https://www.platte-river.com. Email: support@platte-river.com."
              }
            },
            {
              "@type": "Question",
              "name": "What is GIS Kickstart?",
              "acceptedAnswer": {
                "@type": "Answer",
                "text": "GIS Kickstart is a 3-day virtual or on-site ArcGIS Online implementation package from Platte River Analytics. It covers data publishing, schemas, users and groups, web maps, Experience Builder apps and dashboards, security basics, and hands-on training, with optional 10 or 20 hour per month support after handoff. Details: https://www.platte-river.com/gis-kickstart"
              }
            },
            {
              "@type": "Question",
              "name": "Does Platte River Analytics offer Esri or ArcGIS training?",
              "acceptedAnswer": {
                "@type": "Answer",
                "text": "Yes. As an Esri Business Partner they offer instructor-led courses including Introduction to ArcGIS Pro, Intermediate ArcGIS Pro, Introduction to ArcGIS Online, and Building Your First Web App, plus custom classes. Register at https://www.platte-river.com/training"
              }
            },
            {
              "@type": "Question",
              "name": "What is AcreVision?",
              "acceptedAnswer": {
                "@type": "Answer",
                "text": "AcreVision is Platte River Analytics’ buildable acreage analysis widget for energy companies using Esri Enterprise Portal or ArcGIS Online. It factors roads, buildings, floodplains, wetlands, and slope. Details: https://www.platte-river.com/acrevision"
              }
            },
            {
              "@type": "Question",
              "name": "How do I contact Platte River Analytics?",
              "acceptedAnswer": {
                "@type": "Answer",
                "text": "Email support@platte-river.com or use the consultation form at https://www.platte-river.com/#contact. GIS Kickstart inquiries: https://www.platte-river.com/gis-kickstart"
              }
            }
          ]
        }
      ]

  <body>
    <div id="root"></div>
    <!-- Netlify form detection (build-time): must stay in built dist/index.html; pairs with React forms. -->
    <!-- Do not add form-name here — Netlify injects it at deploy. Duplicate breaks some handlers. -->
    <form name="contact" method="POST" data-netlify="true" data-netlify-honeypot="bot-field" style="display:none" aria-hidden="true">
      <input type="text" name="firstName" />
      <input type="text" name="lastName" />
      <input type="email" name="email" />
      <input type="text" name="company" />
      <textarea name="message"></textarea>
      <input type="text" name="bot-field" />
      <input type="text" name="website" />
    </form>
    <form name="training-registration" method="POST" data-netlify="true" data-netlify-honeypot="bot-field" style="display:none" aria-hidden="true">
      <input type="hidden" name="form-name" value="training-registration" />
      <input type="text" name="firstName" />
      <input type="text" name="lastName" />
      <input type="text" name="company" />
      <input type="text" name="position" />
      <input type="email" name="email" />
      <input type="text" name="cityState" />
      <select name="classOption"><option value=""></option></select>
      <input type="text" name="bot-field" />
      <input type="text" name="website" />
    </form>
    <form name="gis-kickstart-inquiry" method="POST" data-netlify="true" data-netlify-honeypot="bot-field" style="display:none" aria-hidden="true">
      <input type="hidden" name="form-name" value="gis-kickstart-inquiry" />
      <input type="hidden" name="subject" value="GIS Kickstart inquiry" />
      <input type="text" name="firstName" />
      <input type="text" name="lastName" />
      <input type="text" name="company" />
      <input type="text" name="position" />
      <input type="email" name="email" />
      <input type="tel" name="phone" />
      <select name="deliveryFormat"><option value=""></option></select>
      <select name="teamSize"><option value=""></option></select>
      <select name="currentPlatform"><option value=""></option></select>
      <select name="supportPackage"><option value=""></option></select>
      <textarea name="message"></textarea>
      <input type="text" name="bot-field" />
      <input type="text" name="website" />
    </form>
    <script type="module" src="/src/main.jsx"></script>
